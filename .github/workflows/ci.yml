name: CI

on:
  push:
    branches: [main, keystone]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run generate
      - run: npm run audit:production

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate
      # The generated site, served through worker.ts as in production.
      - run: |
          npm run preview:worker > wrangler.log 2>&1 &
          for attempt in $(seq 60); do
            curl -skf -o /dev/null https://localhost:4173/ && exit 0
            sleep 2
          done
          cat wrangler.log
          exit 1
      - run: npm run verify:preview
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshots
          path: artifacts/nuxt-port/nuxt-output/
          if-no-files-found: ignore
