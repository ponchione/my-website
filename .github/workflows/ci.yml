name: CI

on:
  push:
    branches: [main, keystone]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run generate
      - run: npm run audit:production

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate
      # The generated site, served through worker.ts as in production.
      - run: |
          npm run preview:worker > wrangler.log 2>&1 &
          for attempt in $(seq 60); do
            curl -skf -o /dev/null https://localhost:4173/ && exit 0
            sleep 2
          done
          cat wrangler.log
          exit 1
      - run: npm run verify:preview
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-screenshots
          path: artifacts/nuxt-port/nuxt-output/
          if-no-files-found: ignore
